---
- name: Instalar ferramentas dev no Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
  when:
    - ansible_os_family == "Debian"
    - dev_tools_install_node | bool

- name: Instalar .NET SDK 8 no Ubuntu
  ansible.builtin.apt:
    name:
      - dotnet-sdk-8.0
      - aspnetcore-runtime-8.0
    state: present
  when:
    - dev_tools_install_dotnet | bool
    - ansible_distribution == "Ubuntu"
  register: dev_tools_dotnet_result
  ignore_errors: true

- name: Avisar quando o .NET nao estiver nos repositorios
  ansible.builtin.debug:
    msg: >-
      .NET SDK nao encontrado nos repositorios. Use o repositorio oficial da
      Microsoft ou o script dotnet-install.sh.
  when:
    - dev_tools_install_dotnet | bool
    - dev_tools_dotnet_result is failed

- name: Instalar ferramentas dev no Arch/CachyOS
  community.general.pacman:
    name: "{{ dev_tools_arch_packages }}"
    state: present
  vars:
    dev_tools_arch_packages: >-
      {{ (['nodejs', 'npm'] if dev_tools_install_node | bool else [])
         + (['dotnet-sdk', 'aspnet-runtime'] if dev_tools_install_dotnet | bool else []) }}
  when:
    - ansible_os_family == "Archlinux"
    - dev_tools_arch_packages | length > 0

- name: Instalar ferramentas dev no Fedora/RHEL
  ansible.builtin.dnf:
    name: "{{ dev_tools_rh_packages }}"
    state: present
  vars:
    dev_tools_rh_packages: >-
      {{ (['nodejs', 'npm'] if dev_tools_install_node | bool else [])
         + (['dotnet-sdk-8.0', 'aspnetcore-runtime-8.0'] if dev_tools_install_dotnet | bool else []) }}
  when:
    - ansible_os_family == "RedHat"
    - dev_tools_rh_packages | length > 0

- name: Instalar ferramentas dev no openSUSE/SLES
  community.general.zypper:
    name: "{{ dev_tools_suse_packages }}"
    state: present
  vars:
    dev_tools_suse_packages: >-
      {{ (['nodejs22', 'npm22'] if dev_tools_install_node | bool else [])
         + (['dotnet-sdk-8.0'] if dev_tools_install_dotnet | bool else []) }}
  when:
    - ansible_os_family == "Suse"
    - dev_tools_suse_packages | length > 0
  failed_when: false

- name: Instalar pacotes globais do NPM
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  loop: "{{ dev_tools_npm_global_packages }}"
  when:
    - dev_tools_install_node | bool
    - dev_tools_npm_global_packages | length > 0

- name: Listar pacotes ja instalados via pipx
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: pipx list --short
  register: dev_tools_pipx_installed
  changed_when: false
  failed_when: false

- name: Instalar ferramentas Python via pipx
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: "pipx install {{ item }}"
  loop: "{{ dev_tools_pipx_packages }}"
  when:
    - dev_tools_pipx_installed.rc | default(1) == 0
    - item not in dev_tools_pipx_installed.stdout
  changed_when: true

- name: Garantir o PATH do pipx
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: pipx ensurepath
  register: dev_tools_pipx_path
  changed_when: "'added to' in dev_tools_pipx_path.stdout | default('')"
  failed_when: false

- name: Instalar mise (gerenciador de versoes)
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise sh
    executable: /bin/bash
  args:
    creates: /usr/local/bin/mise
  when: dev_tools_install_mise | bool
