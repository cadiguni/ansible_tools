---
- name: Instalar pacotes de servidor (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ server_base_packages_debian + server_base_extra_packages }}"
    state: present
  vars:
    server_base_packages_debian: >-
      {{ ['chrony', 'logrotate', 'sudo']
         + (['fail2ban'] if server_base_install_fail2ban | bool else [])
         + (['ufw'] if server_base_configure_firewall | bool else [])
         + (['unattended-upgrades'] if server_base_install_unattended_upgrades | bool else []) }}
  when: ansible_os_family == "Debian"

- name: Instalar pacotes de servidor (Fedora/RHEL)
  ansible.builtin.dnf:
    name: "{{ server_base_packages_rh + server_base_extra_packages }}"
    state: present
  vars:
    server_base_packages_rh: >-
      {{ ['chrony', 'logrotate', 'sudo']
         + (['fail2ban'] if server_base_install_fail2ban | bool else [])
         + (['firewalld'] if server_base_configure_firewall | bool else [])
         + (['dnf-automatic'] if server_base_install_unattended_upgrades | bool else []) }}
  when: ansible_os_family == "RedHat"

- name: Instalar pacotes de servidor (Arch/CachyOS)
  community.general.pacman:
    name: "{{ server_base_packages_arch + server_base_extra_packages }}"
    state: present
  vars:
    server_base_packages_arch: >-
      {{ ['chrony', 'logrotate', 'sudo']
         + (['fail2ban'] if server_base_install_fail2ban | bool else [])
         + (['ufw'] if server_base_configure_firewall | bool else []) }}
  when: ansible_os_family == "Archlinux"

- name: Instalar pacotes de servidor (openSUSE/SLES)
  community.general.zypper:
    name: "{{ server_base_packages_suse + server_base_extra_packages }}"
    state: present
  vars:
    server_base_packages_suse: >-
      {{ ['chrony', 'logrotate', 'sudo']
         + (['fail2ban'] if server_base_install_fail2ban | bool else [])
         + (['firewalld'] if server_base_configure_firewall | bool else []) }}
  when: ansible_os_family == "Suse"

- name: Garantir diretorio de drop-in do sshd
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: server_base_configure_ssh | bool

- name: Garantir que o sshd_config inclua os drop-ins
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    state: present
    validate: /usr/sbin/sshd -t -f %s
  when: server_base_configure_ssh | bool
  notify: Restart sshd

- name: Configurar hardening do SSH
  ansible.builtin.template:
    src: 99-ansible-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  when: server_base_configure_ssh | bool
  notify: Restart sshd

- name: Habilitar sincronizacao de horario
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started
  when: server_base_configure_ntp | bool
  failed_when: false

- name: Configurar UFW (Debian/Arch)
  when:
    - server_base_configure_firewall | bool
    - ansible_os_family in ["Debian", "Archlinux"]
  block:
    - name: Politica padrao de entrada (deny)
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Politica padrao de saida (allow)
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Liberar portas TCP
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ server_base_firewall_allowed_tcp_ports }}"

    - name: Habilitar UFW
      community.general.ufw:
        state: enabled

- name: Configurar firewalld (Fedora/RHEL/openSUSE)
  when:
    - server_base_configure_firewall | bool
    - ansible_os_family in ["RedHat", "Suse"]
  block:
    - name: Habilitar firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Liberar portas TCP
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ server_base_firewall_allowed_tcp_ports }}"

- name: Configurar jails do fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: server_base_install_fail2ban | bool
  notify: Restart fail2ban

- name: Habilitar fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: server_base_install_fail2ban | bool

- name: Habilitar atualizacoes automaticas (Debian/Ubuntu)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  when:
    - server_base_install_unattended_upgrades | bool
    - ansible_os_family == "Debian"

- name: Habilitar dnf-automatic (Fedora/RHEL)
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when:
    - server_base_install_unattended_upgrades | bool
    - ansible_os_family == "RedHat"
