---
- name: Instalar VS Code (Debian/Ubuntu)
  when: ansible_os_family == "Debian"
  block:
    - name: Criar diretorio de keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Baixar chave da Microsoft
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"

    - name: Adicionar repositorio do VS Code
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/microsoft.asc]
          https://packages.microsoft.com/repos/code stable main
        filename: vscode
        state: present

    - name: Instalar VS Code
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: true

- name: Instalar VS Code OSS (Arch/CachyOS)
  community.general.pacman:
    name: code
    state: present
  when: ansible_os_family == "Archlinux"

- name: Instalar VS Code (Fedora/RHEL)
  when: ansible_os_family == "RedHat"
  block:
    - name: Importar chave da Microsoft
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Adicionar repositorio do VS Code
      ansible.builtin.yum_repository:
        name: code
        description: Visual Studio Code
        baseurl: https://packages.microsoft.com/yumrepos/vscode
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
        enabled: true

    - name: Instalar VS Code
      ansible.builtin.dnf:
        name: code
        state: present

- name: Instalar VS Code (openSUSE/SLES)
  when: ansible_os_family == "Suse"
  block:
    - name: Importar chave da Microsoft
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Adicionar repositorio do VS Code
      community.general.zypper_repository:
        name: vscode
        repo: https://packages.microsoft.com/yumrepos/vscode
        auto_import_keys: true
        state: present

    - name: Instalar VS Code
      community.general.zypper:
        name: code
        state: present

- name: Listar extensoes ja instaladas
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: code --list-extensions
  register: vscode_installed
  changed_when: false
  failed_when: false

- name: Instalar extensoes do VS Code
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    cmd: "code --install-extension {{ item }}"
  loop: "{{ vscode_extensions }}"
  when:
    - vscode_installed.rc | default(1) == 0
    - item | lower not in (vscode_installed.stdout | lower)
  changed_when: true
  failed_when: false
