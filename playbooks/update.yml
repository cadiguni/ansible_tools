---
- name: Atualizar todos os pacotes do sistema
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Atualizar pacotes no Debian/Ubuntu
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: true
        autoclean: true
      when: ansible_os_family == "Debian"

    - name: Atualizar pacotes no Arch/CachyOS
      community.general.pacman:
        update_cache: true
        upgrade: true
      when: ansible_os_family == "Archlinux"

    - name: Atualizar pacotes no Fedora/RHEL
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: false
      when: ansible_os_family == "RedHat"

    - name: Atualizar pacotes no openSUSE/SLES
      community.general.zypper:
        name: "*"
        state: latest
      when: ansible_os_family == "Suse"

    - name: Verificar se o Flatpak esta instalado
      ansible.builtin.stat:
        path: /usr/bin/flatpak
      register: flatpak_bin
      tags: [flatpak]

    - name: Atualizar apps Flatpak
      ansible.builtin.command:
        cmd: flatpak update --noninteractive --assumeyes
      register: flatpak_update
      changed_when: "'Nothing to do' not in flatpak_update.stdout"
      when: flatpak_bin.stat.exists
      tags: [flatpak]

    - name: Verificar se o sistema precisa de reboot (Debian)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
      when: ansible_os_family == "Debian"

    - name: Avisar sobre reboot pendente
      ansible.builtin.debug:
        msg: "Reboot pendente neste host."
      when:
        - ansible_os_family == "Debian"
        - reboot_required.stat.exists | default(false)
